[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qpet"
version = "0.1.0"
description = "Numerical Watchcat for dissipative bosonic quantum simulations"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
physics = ["dynamiqs>=0.3.7"]

[tool.setuptools.packages.find]
include = ["qpet*"]
